<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nie znaleziono strony – BelferIT</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2314234b'/><text x='16' y='23' font-family='Arial,sans-serif' font-size='19' font-weight='900' text-anchor='middle' fill='%23ffc94a'>B</text></svg>">
  <style>
    :root { --bg: #f5f7fc; --text: #14234b; --muted: #4d5a78; --accent: #14234b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b142c; --text: #eaf0fc; --muted: #aab6d4; --accent: #ffc94a; }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      box-sizing: border-box;
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      text-align: center;
    }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.6rem, 4vw, 2.2rem); }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    a { color: var(--accent); font-weight: 800; text-decoration-color: #ffc94a; text-decoration-thickness: 3px; text-underline-offset: .2em; }
    @font-face { font-family: "Nunito"; font-weight: 200 1000; font-display: swap; src: url(/fonts/nunito-latin-ext-wght-normal.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F; }
    @font-face { font-family: "Nunito"; font-weight: 200 1000; font-display: swap; src: url(/fonts/nunito-latin-wght-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  </style>
</head>
<body>
  <main>
    <div aria-hidden="true" style="font-size:3rem">🧭</div>
    <h1>Nie ma takiej strony</h1>
    <p>Sprawdź adres albo wróć do listy tematów.</p>
    <a href="/">← Wróć do tematów</a>
  </main>
</body>
</html>
