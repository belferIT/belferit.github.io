<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nie znaleziono strony – BelferIT</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">
  <style>
    :root { --bg: #f4f6fb; --text: #1d2433; --muted: #5b6478; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #11151f; --text: #e8ecf5; --muted: #9aa3b8; --accent: #6c9bff; }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      text-align: center;
    }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.6rem, 4vw, 2.2rem); }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div aria-hidden="true" style="font-size:3rem">🧭</div>
    <h1>Nie ma takiej strony</h1>
    <p>Sprawdź adres albo wróć do listy tematów.</p>
    <a href="/">← Wróć do tematów</a>
  </main>
</body>
</html>
