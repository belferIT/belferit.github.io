<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informatyka – materiały dla uczniów</title>
  <meta name="description" content="Materiały do lekcji informatyki – ITTeacherPL">
  <meta name="color-scheme" content="light dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Informatyka – materiały dla uczniów">
  <meta property="og:description" content="Materiały do lekcji informatyki – ITTeacherPL">
  <meta property="og:url" content="https://wojcieh.github.io/">
  <meta property="og:locale" content="pl_PL">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1d2433;
      --muted: #5b6478;
      --accent: #2563eb;
      --accent-soft: #e0e9ff;
      --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11151f;
        --card: #1a2030;
        --text: #e8ecf5;
        --muted: #9aa3b8;
        --accent: #6c9bff;
        --accent-soft: #24304d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    main {
      flex: 1;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 1.5rem 3rem;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .card {
      display: block;
      height: 100%;
      background: var(--card);
      border-radius: var(--radius);
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      border: 2px solid transparent;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 6px 20px rgba(0,0,0,.1);
      outline: none;
    }
    .card .icon {
      width: 52px; height: 52px;
      border-radius: 12px;
      background: var(--accent-soft);
      display: grid; place-items: center;
      font-size: 1.6rem;
      margin-bottom: 1rem;
    }
    .card h2 {
      margin: 0 0 .4rem;
      font-size: 1.25rem;
    }
    .card p {
      margin: 0 0 1rem;
      color: var(--muted);
    }
    .card .go {
      color: var(--accent);
      font-weight: 600;
    }
    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: .9rem;
    }
    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card:hover, .card:focus-visible { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="sr-only">Informatyka – materiały do lekcji</h1>
    <ul class="cards">
      <!-- Kolejne tematy dodawaj, kopiując cały blok <li>…</li> -->
      <li>
        <a class="card" href="bezpieczenstwo-w-sieci/">
          <div class="icon" aria-hidden="true">🔒</div>
          <h2>Bezpieczeństwo w sieci</h2>
          <p>Jak chronić siebie i swoich bliskich w internecie.</p>
          <span class="go" aria-hidden="true">Przejdź →</span>
        </a>
      </li>
      <li>
        <a class="card" href="INF.04%20%E2%80%93%20checklista%20umiej%C4%99tno%C5%9Bci.html">
          <div class="icon" aria-hidden="true">✅</div>
          <h2>INF.04 – checklista umiejętności</h2>
          <p>Sprawdź, co już umiesz przed egzaminem zawodowym, i zobacz, co trzeba powtórzyć.</p>
          <span class="go" aria-hidden="true">Przejdź →</span>
        </a>
      </li>
    </ul>
  </main>

  <footer>
    ITTeacherPL
  </footer>
</body>
</html>
