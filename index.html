<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informatyka – materiały dla uczniów</title>
  <meta name="description" content="Materiały do lekcji informatyki – Marcin Wojciechowski">
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1d2433;
      --muted: #5b6478;
      --accent: #2563eb;
      --accent-soft: #e0e9ff;
      --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11151f;
        --card: #1a2030;
        --text: #e8ecf5;
        --muted: #9aa3b8;
        --accent: #6c9bff;
        --accent-soft: #24304d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 3.5rem 1.5rem 2rem;
      text-align: center;
    }
    header h1 {
      margin: 0 0 .5rem;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 1.1rem;
    }
    main {
      flex: 1;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem 1.5rem 3rem;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }
    .card {
      display: block;
      background: var(--card);
      border-radius: var(--radius);
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      border: 2px solid transparent;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 6px 20px rgba(0,0,0,.1);
      outline: none;
    }
    .card .icon {
      width: 52px; height: 52px;
      border-radius: 12px;
      background: var(--accent-soft);
      display: grid; place-items: center;
      font-size: 1.6rem;
      margin-bottom: 1rem;
    }
    .card h2 {
      margin: 0 0 .4rem;
      font-size: 1.25rem;
    }
    .card p {
      margin: 0 0 1rem;
      color: var(--muted);
    }
    .card .go {
      color: var(--accent);
      font-weight: 600;
    }
    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Informatyka</h1>
    <p>Materiały do lekcji – wybierz temat</p>
  </header>

  <main>
    <div class="cards">
      <!-- Kolejne tematy dodawaj, kopiując cały blok <a class="card">…</a> -->
      <a class="card" href="bezpieczenstwo-w-sieci/">
        <div class="icon" aria-hidden="true">🔒</div>
        <h2>Bezpieczeństwo w sieci</h2>
        <p>Jak chronić siebie i swoich bliskich w internecie.</p>
        <span class="go">Przejdź →</span>
      </a>
    </div>
  </main>

  <footer>
    Marcin Wojciechowski
  </footer>
</body>
</html>
